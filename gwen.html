<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Archives : Spider-Gwen</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Couleurs adaptées à Spider-Gwen : Rose/Violet pour les events, Cyan/Bleu pour le classique */
        .event-border {
            border-left: 4px solid #ec4899; /* Pink-500 */
        }
        .classic-border {
            border-left: 4px solid #06b6d4; /* Cyan-500 */
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="root"></div>

    <script type="text/babel">
        const readingOrder = [
            {
                title: "Les Origines & Spider-Verse",
                type: "event",
                issues: [
                    "Edge of Spider-Verse #2 (Première apparition)",
                    "Amazing Spider-Man Vol. 3 #7-15 (Spider-Verse Event)"
                ]
            },
            {
                title: "Spider-Gwen Vol. 1 (2015)",
                type: "classic",
                issues: [
                    "Spider-Gwen Vol. 1 #1-5"
                ]
            },
            {
                title: "Radioactive Spider-Gwen (Partie 1)",
                type: "classic",
                issues: [
                    "Spider-Gwen Vol. 2 #1-6"
                ]
            },
            {
                title: "Spider-Women (Événement Crossover)",
                type: "event",
                issues: [
                    "Spider-Women Alpha #1",
                    "Spider-Gwen Vol. 2 #7",
                    "Silk Vol. 2 #7",
                    "Spider-Woman Vol. 6 #6",
                    "Spider-Gwen Vol. 2 #8",
                    "Silk Vol. 2 #8",
                    "Spider-Woman Vol. 6 #7",
                    "Spider-Women Omega #1"
                ]
            },
            {
                title: "Radioactive Spider-Gwen (Partie 2)",
                type: "classic",
                issues: [
                    "Spider-Gwen Vol. 2 #9-15",
                    "Spider-Gwen Annual #1"
                ]
            },
            {
                title: "Sitting in a Tree (Crossover avec Miles Morales)",
                type: "event",
                issues: [
                    "Spider-Man #12",
                    "Spider-Gwen Vol. 2 #16",
                    "Spider-Man #13",
                    "Spider-Gwen Vol. 2 #17",
                    "Spider-Man #14",
                    "Spider-Gwen Vol. 2 #18"
                ]
            },
            {
                title: "Radioactive Spider-Gwen (Fin)",
                type: "classic",
                issues: [
                    "Spider-Gwen Vol. 2 #19-34"
                ]
            },
            {
                title: "Spider-Geddon (Événement)",
                type: "event",
                issues: [
                    "Spider-Geddon #1-5",
                    "Spider-Gwen: Ghost-Spider #1-4 (Tie-ins)"
                ]
            },
            {
                title: "Spider-Gwen: Ghost-Spider (2018)",
                type: "classic",
                issues: [
                    "Spider-Gwen: Ghost-Spider #5-10"
                ]
            },
            {
                title: "Ghost-Spider (2019)",
                type: "classic",
                issues: [
                    "Ghost-Spider #1-10"
                ]
            },
            {
                title: "King in Black: Gwenom vs Carnage",
                type: "event",
                issues: [
                    "King in Black: Gwenom vs Carnage #1-3"
                ]
            },
            {
                title: "L'ère Multiverselle (Mini-séries)",
                type: "classic",
                issues: [
                    "Spider-Gwen: Gwenverse #1-5",
                    "Spider-Gwen: Shadow Clones #1-5",
                    "Spider-Gwen: Smash #1-4"
                ]
            },
            {
                title: "Spider-Gwen: The Ghost-Spider (Actuelle)",
                type: "classic",
                issues: [
                    "Spider-Gwen: The Ghost-Spider #1-6 (En cours)"
                ]
            }
        ];

        const NarrativeBlock = ({ block, index }) => {
            // Tous les blocs sont rétractés par défaut (isOpen = false)
            const [isOpen, setIsOpen] = React.useState(false);
            const isEvent = block.type === "event";

            return (
                <div className={`glass-panel rounded-lg mb-4 overflow-hidden shadow-lg transition-all duration-300 ${isEvent ? 'event-border' : 'classic-border'}`}>
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full flex items-center justify-between p-4 bg-slate-800 bg-opacity-50 hover:bg-opacity-80 transition-colors focus:outline-none"
                    >
                        <div className="flex items-center gap-3">
                            <span className={`text-xs font-bold px-2 py-1 rounded uppercase tracking-wider ${isEvent ? 'bg-pink-500/20 text-pink-400' : 'bg-cyan-500/20 text-cyan-400'}`}>
                                {isEvent ? 'Événement' : 'Classique'}
                            </span>
                            <h2 className="text-xl font-bold text-white text-left">{block.title}</h2>
                        </div>
                        <div className="text-slate-400">
                            {isOpen ? (
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7"></path></svg>
                            ) : (
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                            )}
                        </div>
                    </button>
                    
                    {}
                    {isOpen && (
                        <div className="p-4 border-t border-slate-700 bg-slate-900/50">
                            <ul className="space-y-2">
                                {block.issues.map((issue, idx) => (
                                    <li key={idx} className="flex items-start gap-3 p-2 rounded hover:bg-slate-800/50 transition-colors">
                                        <div className={`mt-1.5 w-2 h-2 rounded-full flex-shrink-0 ${isEvent ? 'bg-pink-500' : 'bg-cyan-500'}`}></div>
                                        <span className="text-slate-300 font-medium">{issue}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            return (
                <div className="max-w-4xl mx-auto">
                    <header className="mb-10 text-center">
                        <h1 className="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 mb-4 tracking-tight">
                            Spider-Archives : Spider-Gwen
                        </h1>
                        <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                            Navigateur chronologique. Tous les blocs narratifs sont rétractés par défaut pour une lecture optimale. Cliquez sur un bloc pour l'ouvrir.
                        </p>
                    </header>

                    {}
                    <div className="space-y-2">
                        {readingOrder.map((block, index) => (
                            <NarrativeBlock key={index} block={block} index={index} />
                        ))}
                    </div>
                    
                    <footer className="mt-12 text-center text-sm text-slate-500 pb-8">
                        L'ordre des chapitres a été fusionné (ex: #1-5) pour faciliter la navigation.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
