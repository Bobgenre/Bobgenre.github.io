        }
        .swiss-box {
            background: rgba(5, 11, 26, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.18);
            transition: all 0.2s ease;
        }
        .swiss-match-row {
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.18s ease;
        }
        .swiss-match-row:last-child {
            border-bottom: none;
        }
        .swiss-match-row.clickable:hover {
            background: linear-gradient(90deg, rgba(14, 165, 233, 0.22), rgba(245, 158, 11, 0.22));

            z-index: 10;
        }
        .swiss-header {
            background: rgba(15, 28, 63, 0.95);
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 10px;
            letter-spacing: 0.06em;
        }
        .swiss-advance-header {
            background: linear-gradient(90deg, #00e5ff 0%, #00b4d8 100%);
            color: #020617;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 0.05em;
        }
        .swiss-elim-header {
            background: rgba(15, 23, 42, 0.95);
            color: #94a3b8;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 0.05em;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 15, 25, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; flex-direction: column;
            transition: opacity 0.3s;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #f59e0b;
            animation: spin 1s ease infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .worlds-gradient {
            background: linear-gradient(to right, #f59e0b, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        .tab-btn.active {

        function calculateEloRatings() {
            const eloMap = {};
            const regionBaseElo = { 'LCK': 1590, 'LPL': 1575, 'LEC': 1515, 'LCS': 1475, 'LCP': 1410, 'CBLOL': 1360 };

            teamsData.forEach(t => {
                const s = t.golStats;
                const regBase = regionBaseElo[t.region] || 1450;
                const regCoeff = regionCoefficients[t.region] || 0.8;
                const wrParts = t.golStats.winRate.match(/(\d+)%\s*\((\d+)W\s*-\s*(\d+)L\)/);
                const wr = wrParts ? parseFloat(wrParts[1]) : 50;
                const wins = wrParts ? parseInt(wrParts[2], 10) : 15;
                const losses = wrParts ? parseInt(wrParts[3], 10) : 15;
                const totalGames = wins + losses;

                // Facteur d'échantillon : valorise les saisons longues (50+ games en LCK/LPL/LEC) face aux splits courts (26 games en LCS)
                const sampleFactor = Math.min(1.15, Math.max(0.68, Math.sqrt(totalGames / 42)));

                let seedBonus = 0;
                if (t.seed.includes('MSI')) seedBonus = 45;
                else if (t.seed.includes('Seed 1') || t.seed.includes('Champion')) seedBonus = 40;
                else if (t.seed.includes('Seed 2')) seedBonus = 20;
                else if (t.seed.includes('Seed 3') && !t.seed.includes('Play-In')) seedBonus = 10;

                const netWins = wins - losses;
                // Pondération du Winrate domestique par la difficulté de la ligue et la taille de l'échantillon
                const wrBonus = ((wr - 50) * 2.1 + (netWins * 1.9)) * regCoeff * sampleFactor;

                // Plafonnement des stats d'écrasement domestique (évite qu'un +1205 GD@15 en LCS/LCP fausse tout)
                const cappedGd15 = Math.min(900, Math.max(-900, s.gd15));
                const cappedGdpm = Math.min(180, Math.max(-180, s.gdpm));

                const econScore = ((cappedGdpm * 0.18) + (cappedGd15 / 38) + ((s.gpm - 1960) * 0.14) + ((s.wrAhead - 72) * 0.85) + ((s.ftPct - 52) * 0.65)) * regCoeff;
                const combatScore = (((s.dpm - 2650) / 16) + ((Math.min(2.8, s.kd) - 1.7) * 18) + ((s.fbPct - 50) * 0.30)) * Math.pow(regCoeff, 0.8);
                const macroScore = (((parseFloat(s.dragons) - 53) * 0.85) + ((parseFloat(s.nashors) - 55) * 0.75) + ((s.voidgrubs - 1.45) * 10) + ((s.vspm - 10.1) * 12)) * regCoeff;

                const avgRoster = t.roster.reduce((sum, p) => sum + p.score, 0) / 5;
                const rosterBonus = (avgRoster - 85) * 5.2;

                const intlInfo = internationalPedigree[t.id] || { bonus: 0, label: 'Standard' };
                const intlBonus = intlInfo.bonus;

                const rawElo = regBase + seedBonus + wrBonus + econScore + combatScore + macroScore + rosterBonus + intlBonus;
                eloMap[t.id] = { 
                    team: t, 
                    elo: Math.round(rawElo), 
                    breakdown: { 
                        playInDelta: 0,
                        intlBonus: intlBonus,
                        intlLabel: intlInfo.label,
                        domScore: Math.round(wrBonus + econScore + combatScore + macroScore)
                    } 
                };
            });

            matchesData.filter(m => m.status === 'finished').forEach(match => {
                const t1 = teamsData.find(t => t.name.toLowerCase() === match.team1.toLowerCase());
                const t2 = teamsData.find(t => t.name.toLowerCase() === match.team2.toLowerCase());
                if (!t1 || !t2) return;
                const entry1 = eloMap[t1.id];
                const entry2 = eloMap[t2.id];
                const [s1, s2] = match.score.split('-').map(s => parseInt(s.trim(), 10));
                const expected1 = 1 / (1 + Math.pow(10, (entry2.elo - entry1.elo) / 400));
                const actual1 = s1 > s2 ? 1 : 0;
                const delta = Math.round(28 * (1 + (Math.abs(s1 - s2) - 1) * 0.25) * (actual1 - expected1));
                entry1.elo += delta; entry1.breakdown.playInDelta += delta;
                entry2.elo -= delta; entry2.breakdown.playInDelta -= delta;
            });

            return Object.values(eloMap).sort((a, b) => b.elo - a.elo);
        }

        function computeAdvancedMatchPrediction(team1, team2, rankedTeams) {
            const r1 = rankedTeams.find(r => r.team.id === team1.id);
            const r2 = rankedTeams.find(r => r.team.id === team2.id);
            const elo1 = r1 ? r1.elo : 1500;
            const elo2 = r2 ? r2.elo : 1500;
            
            // Correction de la pondération : On donne le poids principal à l'Elo et aux stats S16 (gol.gg)
            const probElo1 = 1 / (1 + Math.pow(10, (elo2 - elo1) / 400));

            const avgRoster1 = team1.roster.reduce((sum, p) => sum + p.score, 0) / 5;
            const avgRoster2 = team2.roster.reduce((sum, p) => sum + p.score, 0) / 5;
            const probRoster1 = 1 / (1 + Math.pow(10, (avgRoster2 - avgRoster1) / 25));

            // Stabilité globale : 70% Elo & Roster Global S16, 30% Worlds
            let probWorlds1 = 0.5;
            const hasWorldsStats = (team1.worldsStats && team1.worldsStats.played) || (team2.worldsStats && team2.worldsStats.played);
            if (hasWorldsStats) {
                const w1 = team1.worldsStats && team1.worldsStats.played ? team1.worldsStats : team1.golStats;
                const w2 = team2.worldsStats && team2.worldsStats.played ? team2.worldsStats : team2.golStats;
                const wIndex1 = (w1.gd15 / 30) + (w1.gdpm * 0.2) + (w1.dpm / 50) + (w1.kd * 10);
                const wIndex2 = (w2.gd15 / 30) + (w2.gdpm * 0.2) + (w2.dpm / 50) + (w2.kd * 10);
                probWorlds1 = 1 / (1 + Math.pow(10, (wIndex2 - wIndex1) / 80));
            }

            const combinedProb = hasWorldsStats ? (probElo1 * 0.50) + (probRoster1 * 0.25) + (probWorlds1 * 0.25) : (probElo1 * 0.65) + (probRoster1 * 0.35);
            const p = Math.min(0.92, Math.max(0.08, combinedProb));
            const q = 1 - p;

            const p3_0 = Math.pow(p, 3);
            const p3_1 = 3 * Math.pow(p, 3) * q;
            const p3_2 = 6 * Math.pow(p, 3) * Math.pow(q, 2);
            const p2_3 = 6 * Math.pow(q, 3) * Math.pow(p, 2);
            const p1_3 = 3 * Math.pow(q, 3) * p;
            const p0_3 = Math.pow(q, 3);

            // Calcul des probabilités en Bo3 (pour les matchs 2-0, 0-2, 2-1, 1-2, 2-2)
            const p2_0 = Math.pow(p, 2);
            const p2_1 = 2 * Math.pow(p, 2) * q;
            const p1_2 = 2 * Math.pow(q, 2) * p;
            const p0_2 = Math.pow(q, 2);
            const bo3WinProb1 = p2_0 + p2_1;
            const bo3Outcomes = [
                { score: '2 - 0', prob: p2_0 }, { score: '2 - 1', prob: p2_1 },
                { score: '1 - 2', prob: p1_2 }, { score: '0 - 2', prob: p0_2 }
            ];
            const bestBo3Outcome = [...bo3Outcomes].sort((a, b) => b.prob - a.prob)[0];

            const seriesWinProb1 = p3_0 + p3_1 + p3_2;
            const scoreOutcomes = [
                { score: '3 - 0', prob: p3_0 }, { score: '3 - 1', prob: p3_1 }, { score: '3 - 2', prob: p3_2 },
                { score: '2 - 3', prob: p2_3 }, { score: '1 - 3', prob: p1_3 }, { score: '0 - 3', prob: p0_3 }
            ];
            const bestOutcome = [...scoreOutcomes].sort((a, b) => b.prob - a.prob)[0];

            return {
                elo1, elo2, hasWorldsStats,
                gamePct1: Math.round(p * 100),
                gamePct2: 100 - Math.round(p * 100),
                bo3Pct1: Math.round(bo3WinProb1 * 100),
                bo3Pct2: 100 - Math.round(bo3WinProb1 * 100),
                predictedBo3Score: bestBo3Outcome.score,
                bo3Outcomes,
                seriesPct1: Math.round(seriesWinProb1 * 100),
                seriesPct2: 100 - Math.round(seriesWinProb1 * 100),
                predictedScore: bestOutcome.score,
                scoreOutcomes
            };
        }

        function parseRawTable(rawArray, totalGamesCount) {
            return rawArray.map(row => {
                const [name, pb, bans, picks, by, wins, losses, k, d, a, kda, csm, vsm, gpm, dpm, kpar, ks, gs] = row;
                const meta = championMeta[name] || { id: name.replace(/[^a-zA-Z]/g, ''), role: 'Flex', flex: 'Flex' };
                const presence = Number(((pb / totalGamesCount) * 100).toFixed(1));
                const pickRate = Number(((picks / totalGamesCount) * 100).toFixed(1));
                const banRate = Number(((bans / totalGamesCount) * 100).toFixed(1));
                const winRate = picks > 0 ? Number(((wins / picks) * 100).toFixed(1)) : 0;
                return {
                    id: meta.id,
                    name,
                    role: meta.role,
                    flex: meta.flex,
                    presenceCount: pb,
                    presence,
                    bans,
                    banRate,
                    picks,
                    pickRate,
                    by,
                    wins,
                    losses,
                    winRate,
                    k, d, a, kda,
                    csm, vsm, gpm, dpm,
                    kpar, ks, gs
                };
            });
        }

        function buildRealChampionsData(stageFilter = 'MAIN') {
            if (stageFilter === 'MAIN') {
                return { champs: parseRawTable(leaguepediaMainEventRaw, 29), totalGamesCount: 29 };
            }
            if (stageFilter === 'PLAYIN') {
                return { champs: parseRawTable(leaguepediaPlayInRaw, 22), totalGamesCount: 22 };
            }

            // Cumul exact Main Event (29) + Play-In (22) = 51 parties
            const totalGamesCount = 51;
            const mainChamps = parseRawTable(leaguepediaMainEventRaw, 29);
            const playInChamps = parseRawTable(leaguepediaPlayInRaw, 22);
            const mergedMap = {};

            function addEntry(entry) {
                if (!mergedMap[entry.name]) {
                    mergedMap[entry.name] = { ...entry };
                } else {
                    const prev = mergedMap[entry.name];
                    const totalPicks = prev.picks + entry.picks;
                    const totalPb = prev.presenceCount + entry.presenceCount;
                    const totalBans = prev.bans + entry.bans;
                    const totalWins = prev.wins + entry.wins;
                    const totalLosses = prev.losses + entry.losses;

                    let k = 0, d = 0, a = 0, kda = 0, csm = 0, vsm = 0, gpm = 0, dpm = 0, kpar = '-', ks = '-', gs = '-';
                    if (totalPicks > 0) {
                        k = Number((((prev.k * prev.picks) + (entry.k * entry.picks)) / totalPicks).toFixed(2));
                        d = Number((((prev.d * prev.picks) + (entry.d * entry.picks)) / totalPicks).toFixed(2));
                        a = Number((((prev.a * prev.picks) + (entry.a * entry.picks)) / totalPicks).toFixed(2));
                        kda = d > 0 ? Number(((k + a) / d).toFixed(2)) : Number((k + a).toFixed(2));
                        csm = Number((((prev.csm * prev.picks) + (entry.csm * entry.picks)) / totalPicks).toFixed(2));
                        vsm = Number((((prev.vsm * prev.picks) + (entry.vsm * entry.picks)) / totalPicks).toFixed(2));
                        gpm = Math.round(((prev.gpm * prev.picks) + (entry.gpm * entry.picks)) / totalPicks);
                        dpm = Number((((prev.dpm * prev.picks) + (entry.dpm * entry.picks)) / totalPicks).toFixed(1));

                        const kpar1 = parseFloat(prev.kpar) || 0;
                        const kpar2 = parseFloat(entry.kpar) || 0;
                        kpar = (((kpar1 * prev.picks) + (kpar2 * entry.picks)) / totalPicks).toFixed(1) + '%';

                        const ks1 = parseFloat(prev.ks) || 0;
                        const ks2 = parseFloat(entry.ks) || 0;
                        ks = (((ks1 * prev.picks) + (ks2 * entry.picks)) / totalPicks).toFixed(1) + '%';

                        const gs1 = parseFloat(prev.gs) || 0;
                        const gs2 = parseFloat(entry.gs) || 0;
                        gs = (((gs1 * prev.picks) + (gs2 * entry.picks)) / totalPicks).toFixed(1) + '%';
                    }

                    mergedMap[entry.name] = {
                        ...prev,
                        presenceCount: totalPb,
                        presence: Number(((totalPb / totalGamesCount) * 100).toFixed(1)),
                        bans: totalBans,
                        banRate: Number(((totalBans / totalGamesCount) * 100).toFixed(1)),
                        picks: totalPicks,
                        pickRate: Number(((totalPicks / totalGamesCount) * 100).toFixed(1)),
                        by: Math.max(prev.by || 0, entry.by || 0),
                        wins: totalWins,
                        losses: totalLosses,
                        winRate: totalPicks > 0 ? Number(((totalWins / totalPicks) * 100).toFixed(1)) : 0,
                        k, d, a, kda, csm, vsm, gpm, dpm, kpar, ks, gs
                    };
                }
            }

            mainChamps.forEach(addEntry);
            playInChamps.forEach(addEntry);

            const champs = Object.values(mergedMap).map(c => ({
                ...c,
                presence: Number(((c.presenceCount / totalGamesCount) * 100).toFixed(1)),
                pickRate: Number(((c.picks / totalGamesCount) * 100).toFixed(1)),
                banRate: Number(((c.bans / totalGamesCount) * 100).toFixed(1))
            }));

            return { champs, totalGamesCount };
        }

        function buildMatchPredictionCardHtml(t1, t2, stageLabel, dateLabel, formatLabel, ranked) {
            const pred = computeAdvancedMatchPrediction(t1, t2, ranked);
            const isBo1 = formatLabel === 'Bo1';
            const isBo3 = formatLabel === 'Bo3';
            const pct1 = isBo1 ? pred.gamePct1 : isBo3 ? pred.bo3Pct1 : pred.seriesPct1;
            const pct2 = isBo1 ? pred.gamePct2 : isBo3 ? pred.bo3Pct2 : pred.seriesPct2;

            const roleComparisons = t1.roster.map((p1, idx) => {
                const p2 = t2.roster[idx];
                const diff = p1.score - p2.score;
                let verdict = 'Équilibré';
                let badgeColor = 'bg-gray-700 text-gray-300';
                if (diff > 3) { verdict = `Avantage ${t1.name}`; badgeColor = 'bg-amber-500/20 text-amber-400'; }
                else if (diff < -3) { verdict = `Avantage ${t2.name}`; badgeColor = 'bg-purple-500/20 text-purple-400'; }
                return `
                    <div class="flex justify-between items-center py-2 border-b border-gray-700/30 text-xs">
                        <span class="font-bold text-white w-1/3">${p1.name} (${p1.score})</span>
                        <span class="text-gray-400 font-bold uppercase text-[10px] w-1/3 text-center">${p1.role}</span>
                        <span class="font-bold text-white w-1/3 text-right">${p2.name} (${p2.score})</span>
                    </div>
                    <div class="text-center pb-2"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${badgeColor}">${verdict}</span></div>
                `;
            }).join('');

            const outcomesHtml = isBo1 ? `
                <div class="col-span-3 bg-gray-900/60 p-3 rounded text-center border ${pct1 >= 50 ? 'border-amber-500 bg-amber-500/10' : 'border-gray-700/40'}">
                    <span class="text-xs text-gray-400 block">Victoire ${t1.name} (1 - 0)</span>
                    <span class="text-base font-black text-amber-400">${pct1}%</span>
                </div>
                <div class="col-span-3 bg-gray-900/60 p-3 rounded text-center border ${pct2 > 50 ? 'border-purple-500 bg-purple-500/10' : 'border-gray-700/40'}">
                    <span class="text-xs text-gray-400 block">Victoire ${t2.name} (0 - 1)</span>
                    <span class="text-base font-black text-purple-400">${pct2}%</span>
                </div>
            ` : isBo3 ? pred.bo3Outcomes.map(o => `
                <div class="bg-gray-900/60 p-2 rounded text-center border border-gray-700/40 ${o.score === pred.predictedBo3Score ? 'border-amber-500 bg-amber-500/10' : ''}">
                    <span class="text-xs text-gray-400 block">${o.score}</span>
                    <span class="text-sm font-black text-white">${Math.round(o.prob * 100)}%</span>
                </div>
            `).join('') : pred.scoreOutcomes.map(o => `
                <div class="bg-gray-900/60 p-2 rounded text-center border border-gray-700/40 ${o.score === pred.predictedScore ? 'border-amber-500 bg-amber-500/10' : ''}">
                    <span class="text-xs text-gray-400 block">${o.score}</span>
                    <span class="text-sm font-black text-white">${Math.round(o.prob * 100)}%</span>
                </div>
            `).join('');

            const displayScore = isBo1
                ? (pct1 >= 50 ? '1 - 0' : '0 - 1')
                : isBo3 ? pred.predictedBo3Score : pred.predictedScore;

            return `
                <div class="bg-gray-800/85 border border-gray-700/50 rounded-2xl p-6 shadow-xl space-y-6">
                    <div class="flex justify-between items-center text-xs text-gray-400 uppercase font-bold border-b border-gray-700 pb-3">
                        <span class="text-amber-400">${stageLabel} - ${formatLabel}</span>
                        <span>📅 ${dateLabel}</span>
                    </div>

                    <!-- MAIN PROBABILITY BAR -->
                    <div class="grid grid-cols-3 items-center text-center">
                        <div class="flex flex-col items-center">
                            <img src="${t1.logo}" referrerpolicy="no-referrer" class="w-16 h-16 object-contain bg-gray-900 rounded-xl p-2 mb-2 border border-gray-700">
                            <h3 class="text-xl sm:text-2xl font-black text-white">${t1.name}</h3>
                            <p class="text-xs text-gray-400">${t1.region} (Elo: ${Math.round(pred.elo1)})</p>
                            <span class="text-3xl sm:text-4xl font-black text-amber-400 mt-1 block">${pct1}%</span>
                        </div>
                        <div>
                            <span class="px-3 py-1 bg-gray-900 rounded-full text-xs font-bold border border-gray-700">VS</span>
                            <span class="block text-lg sm:text-xl font-black text-amber-300 mt-2">Prono : ${displayScore}</span>
                            <span class="text-[10px] text-gray-400 block">Favori : ${pct1 >= 50 ? t1.name : t2.name} (${Math.max(pct1, pct2)}%)</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <img src="${t2.logo}" referrerpolicy="no-referrer" class="w-16 h-16 object-contain bg-gray-900 rounded-xl p-2 mb-2 border border-gray-700">
                            <h3 class="text-xl sm:text-2xl font-black text-white">${t2.name}</h3>
                            <p class="text-xs text-gray-400">${t2.region} (Elo: ${Math.round(pred.elo2)})</p>
                            <span class="text-3xl sm:text-4xl font-black text-purple-400 mt-1 block">${pct2}%</span>
                        </div>
                    </div>

                    <!-- PROGRESS BAR -->
                    <div class="w-full bg-gray-900 h-3 rounded-full overflow-hidden flex border border-gray-700">
                        <div class="bg-amber-500 h-full transition-all duration-500" style="width: ${pct1}%"></div>
                        <div class="bg-purple-600 h-full transition-all duration-500" style="width: ${pct2}%"></div>
                    </div>

                    <!-- COMPARISON GRID -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                        <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/40">
                            <h4 class="text-xs font-bold text-amber-400 uppercase mb-3">⚔️ Confrontations Rôle par Rôle (Stats S16)</h4>
                            ${roleComparisons}
                        </div>

                        <div class="space-y-4">
                            <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/40">
                                <h4 class="text-xs font-bold text-amber-400 uppercase mb-3">📊 Comparatif Early & Macro (gol.gg)</h4>
                                <div class="space-y-2 text-xs">
                                    <div class="flex justify-between py-1 border-b border-gray-700/30"><span class="text-gray-400">Gold Diff @ 15 min</span><span class="font-bold text-emerald-400">${t1.golStats.gd15 > 0 ? '+' + t1.golStats.gd15 : t1.golStats.gd15}g vs ${t2.golStats.gd15 > 0 ? '+' + t2.golStats.gd15 : t2.golStats.gd15}g</span></div>
                                    <div class="flex justify-between py-1 border-b border-gray-700/30"><span class="text-gray-400">First Tower %</span><span class="font-bold text-white">${t1.golStats.ftPct}% vs ${t2.golStats.ftPct}%</span></div>
                                    <div class="flex justify-between py-1 border-b border-gray-700/30"><span class="text-gray-400">Contrôle Dragons %</span><span class="font-bold text-white">${t1.golStats.dragons} vs ${t2.golStats.dragons}</span></div>
                                    <div class="flex justify-between py-1"><span class="text-gray-400">Domination Gold (GPM / DPM)</span><span class="font-bold text-purple-400">${t1.golStats.gpm} / ${t1.golStats.dpm} vs ${t2.golStats.gpm} / ${t2.golStats.dpm}</span></div>
                                </div>
                            </div>

                            <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/40">
                                <h4 class="text-xs font-bold text-amber-400 uppercase mb-3">🔮 Distribution des Probabilités (${formatLabel})</h4>
                                <div class="grid ${isBo3 ? 'grid-cols-4' : 'grid-cols-6'} gap-2">
                                    ${outcomesHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';

            document.getElementById('nav-schedule').addEventListener('click', () => switchTab('schedule'));
            document.getElementById('nav-teams').addEventListener('click', () => switchTab('teams'));
            document.getElementById('nav-players').addEventListener('click', () => switchTab('players'));
            document.getElementById('nav-champions').addEventListener('click', () => switchTab('champions'));
            document.getElementById('home-title').addEventListener('click', () => switchTab('schedule'));

            switchTab('schedule');
        };
    </script>
</body>
</html>
