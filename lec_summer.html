        function calculateEloRatings() {
            // Base Elo ratings per region/status
            const eloMap = {};
            teamsData.forEach(t => {
                let base = 1500;
                if (t.region === 'LCK') base = 1680;
                else if (t.region === 'LPL') base = 1650;
                else if (t.region === 'LEC') base = 1580;
                else if (t.region === 'LCS') base = 1550;
                else if (t.region === 'LCP') base = 1500;
                else if (t.region === 'CBLOL') base = 1450;
                
                // Adjust based on seed or special titles
                if (t.seed.includes('Champion')) base += 50;
                if (t.id === 'GEN') base = 1820;
                if (t.id === 'HLE') base = 1800;
                if (t.id === 'T1') base = 1760;
                if (t.id === 'BLG') base = 1750;
                if (t.id === 'AL') base = 1740;
                if (t.id === 'G2') base = 1710;
                if (t.id === 'DK') base = 1700;

                eloMap[t.id] = {
                    team: t,
                    elo: base,
                    winsCount: t.recentWins.length,
                    lossesCount: t.recentLosses.length
                };
            });

            // Simulate Elo adjustments based on opponents defeated vs lost to
            teamsData.forEach(t => {
                t.recentWins.forEach(winStr => {
                    // find if opponent is in teamsData
                    const opp = teamsData.find(x => winStr.toLowerCase().includes(x.id.toLowerCase()) || winStr.toLowerCase().includes(x.name.toLowerCase()));
                    if (opp && eloMap[opp.id]) {
                        // Winner gains elo proportional to opponent strength
                        eloMap[t.id].elo += Math.round((eloMap[opp.id].elo - eloMap[t.id].elo) * 0.15 + 15);
                    }
                });
                t.recentLosses.forEach(lossStr => {
                    const opp = teamsData.find(x => lossStr.toLowerCase().includes(x.id.toLowerCase()) || lossStr.toLowerCase().includes(x.name.toLowerCase()));
                    if (opp && eloMap[opp.id]) {
                        eloMap[t.id].elo -= Math.round((eloMap[t.id].elo - eloMap[opp.id].elo) * 0.15 + 10);
                    }
                });
            });

            // Sort teams by Elo descending
            return Object.values(eloMap).sort((a, b) => b.elo - a.elo);
        }

                const eloColor = item.elo >= 1750 ? 'text-amber-400' : item.elo >= 1650 ? 'text-purple-400' : item.elo >= 1550 ? 'text-blue-400' : 'text-gray-300';
                
                const winsList = item.team.recentWins.length > 0 ? item.team.recentWins.join(', ') : 'Aucune victoire majeure enregistrée';
                const lossesList = item.team.recentLosses.length > 0 ? item.team.recentLosses.join(', ') : 'Aucune défaite majeure';

                return `
                    <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-5 hover:border-amber-500/40 transition-all shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-4 w-full md:w-1/3">
                            <span class="text-xl font-black w-8 text-center text-gray-400">${rankBadge}</span>
                            <img src="${item.team.logo}" alt="${item.team.name}" class="w-12 h-12 object-contain rounded bg-gray-900 p-1" onerror="this.src='https://placehold.co/60x60/1f2937/ffffff?text=LoL'">
                            <div>
                                <h3 class="font-bold text-white text-base">${item.team.name}</h3>
                                <p class="text-xs text-gray-400">${item.team.region} — <span class="text-amber-400">${item.team.seed}</span></p>
                            </div>
                        </div>

                        <div class="w-full md:w-1/3 text-sm space-y-1">
                            <p class="text-gray-300"><strong class="text-emerald-400">Victoires notables :</strong> ${winsList}</p>
                            <p class="text-gray-400"><strong class="text-rose-400">Défaites contre :</strong> ${lossesList}</p>
                        </div>

                        <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                            <div class="text-right">
                                <span class="text-xs text-gray-400 block uppercase tracking-wider font-semibold">Score Elo</span>
                                <span class="text-2xl font-black ${eloColor}">${item.elo} pts</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            mainContent.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">Classement de Puissance & Système Elo</h2>
                    <p class="text-sm text-gray-400">Ce classement calcule dynamiquement la puissance de chaque équipe en fonction de ses victoires et défaites contre ses adversaires lors des récents splits et tournois internationaux.</p>
                </div>
                <div class="space-y-4">${rowsHTML}</div>
            `;
        }

        function renderTeamsView() {
            const mainContent = document.getElementById('main-content');
            const teamsHTML = teamsData.map(team => `
                <div class="team-card bg-gray-800/80 border border-gray-700/50 rounded-xl p-4 flex items-center space-x-4 shadow-md hover:border-amber-500/40 transition-all cursor-pointer" data-team-id="${team.id}">
                    <img src="${team.logo}" alt="${team.name}" class="w-12 h-12 object-contain rounded bg-gray-900 p-1" onerror="this.src='https://placehold.co/60x60/1f2937/ffffff?text=LoL'">
                    <div class="flex-grow">
                        <h3 class="font-bold text-white text-base">${team.name}</h3>
                        <p class="text-xs text-gray-400">${team.region} — <span class="text-amber-400 font-medium">${team.seed}</span></p>
                    </div>
                </div>
            `).join('');

            mainContent.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">Équipes Engagées & Rosters 2026</h2>
                    <p class="text-sm text-gray-400">Cliquez sur une équipe pour voir son effectif officiel d'octobre 2026 et ses performances.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${teamsHTML}</div>
            `;

            mainContent.querySelectorAll('.team-card').forEach(card => {
                card.addEventListener('click', () => {
                    renderTeamDetailView(card.dataset.teamId);
                });
            });
        }

        function renderTeamDetailView(teamId) {
            const mainContent = document.getElementById('main-content');
            const team = teamsData.find(t => t.id === teamId);
            if (!team) return;

            const rankedTeams = calculateEloRatings();
            const teamEloInfo = rankedTeams.find(item => item.team.id === team.id);
            const teamRank = rankedTeams.findIndex(item => item.team.id === team.id) + 1;
            const teamEloScore = teamEloInfo ? teamEloInfo.elo : 1500;

            const rosterHTML = team.roster.map(player => `
                <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-700/50 flex items-center justify-between">
                    <span class="text-xs uppercase tracking-wider text-amber-400 font-bold">${player.role}</span>
                    <span class="font-semibold text-white">${player.name}</span>
                </div>
            `).join('');

            const teamMatches = matchesData.filter(m => 
                m.team1.toLowerCase().includes(team.name.toLowerCase()) || 
                m.team2.toLowerCase().includes(team.name.toLowerCase()) ||
                m.team1.toLowerCase().includes(team.id.toLowerCase()) ||
                m.team2.toLowerCase().includes(team.id.toLowerCase())
            );

            const matchesHTML = teamMatches.length > 0 ? teamMatches.map(match => {
                const stageName = tournamentStages.find(s => s.id === match.stage)?.name || match.stage;
                return `
                    <div class="bg-gray-900/60 border border-gray-700/50 rounded-lg p-3 flex items-center justify-between text-sm">
                        <div>
                            <span class="text-xs text-amber-400 font-semibold block">${stageName} - ${match.date} (${match.time})</span>
                            <span class="font-bold text-white">${match.team1} vs ${match.team2}</span>
                        </div>
                        <span class="px-2.5 py-1 rounded bg-blue-500/20 text-blue-300 text-xs font-bold">${match.format}</span>
                    </div>
                `;
            }).join('') : '<p class="text-gray-400 text-sm">Aucun match programmé pour le moment.</p>';

            mainContent.innerHTML = `
                <div class="mb-6">
                    <button id="back-to-teams" class="inline-flex items-center space-x-2 text-sm text-amber-400 hover:text-amber-300 font-semibold mb-4 transition-colors">
                        <span>← Retour à la liste des équipes</span>
                    </button>
                    <div class="bg-gray-800/80 border border-gray-700/50 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-xl">
                        <div class="flex flex-col sm:flex-row items-center gap-6">
                            <img src="${team.logo}" alt="${team.name}" class="w-24 h-24 object-contain rounded-xl bg-gray-900 p-2 border border-gray-700" onerror="this.src='https://placehold.co/80x80/1f2937/ffffff?text=LoL'">
                            <div class="text-center sm:text-left">
                                <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 mb-1">
                                    <span class="px-3 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">${team.region}</span>
                                    <span class="px-3 py-0.5 rounded-full text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">${team.seed}</span>
                                </div>
                                <h2 class="text-3xl font-black text-white">${team.name}</h2>
                                <p class="text-sm text-gray-400 mt-1">Tag officiel : <span class="text-gray-200 font-mono font-bold">${team.id}</span></p>
                            </div>
                        </div>
                        <div class="bg-gray-900/80 border border-gray-700/50 rounded-xl p-4 text-center min-w-[160px]">
                            <span class="text-xs text-gray-400 uppercase font-semibold block">Seeding Elo</span>
                            <span class="text-2xl font-black text-amber-400">#${teamRank}</span>
                            <span class="text-xs text-gray-300 block mt-1">${teamEloScore} pts Elo</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-6 shadow-lg">
                        <h3 class="text-lg font-bold text-white mb-4">👥 Roster Officiel (Octobre 2026)</h3>
                        <div class="space-y-3">${rosterHTML}</div>
                    </div>

                    <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-6 shadow-lg">
                        <h3 class="text-lg font-bold text-white mb-4">📅 Matchs & Calendrier de l'équipe</h3>
                        <div class="space-y-3">${matchesHTML}</div>
                    </div>
                </div>
            `;

            document.getElementById('back-to-teams').addEventListener('click', () => {
                renderTeamsView();
            });
        }

        function renderPredictionsView() {
            const mainContent = document.getElementById('main-content');
            const rankedTeams = calculateEloRatings();

            const getPredictedScore = (e1, e2) => {
                const diff = e1 - e2;
                const abs = Math.abs(diff);
                if (abs > 280) return diff > 0 ? "3 - 0" : "0 - 3";
                if (abs > 150) return diff > 0 ? "3 - 1" : "1 - 3";
                return diff > 0 ? "3 - 2" : "2 - 3";
            };

            const predictionsHTML = matchesData.map(match => {
                let elo1 = 1500, elo2 = 1500;
                let team1Obj = teamsData.find(t => match.team1.toLowerCase().includes(t.name.toLowerCase()) || match.team1.toLowerCase().includes(t.id.toLowerCase()));
                let team2Obj = teamsData.find(t => match.team2.toLowerCase().includes(t.name.toLowerCase()) || match.team2.toLowerCase().includes(t.id.toLowerCase()));
                
                if (team1Obj) {
                    const found = rankedTeams.find(r => r.team.id === team1Obj.id);
                    if (found) elo1 = found.elo;
                }
                if (team2Obj) {
                    const found = rankedTeams.find(r => r.team.id === team2Obj.id);
                    if (found) elo2 = found.elo;
                }

                if (match.team1.includes('TBD') || match.team2.includes('TBD') || !team1Obj || !team2Obj) {
                    return `
                        <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-5 shadow-lg">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-semibold uppercase tracking-wider px-2.5 py-1 bg-amber-500/10 text-amber-400 rounded-full">Play-In Stage</span>
                                <span class="text-sm text-gray-400">📅 ${match.date} à ${match.time}</span>
                            </div>
                            <div class="text-center py-4 text-gray-400 font-semibold">
                                Match : ${match.team1} vs ${match.team2} (${match.format})
                                <p class="text-xs text-gray-500 mt-1">Les pronostiques détaillés seront disponibles dès que les équipes seront qualifiées.</p>
                            </div>
                        </div>
                    `;
                }

                // Win probability via Elo formula
                const prob1 = 1 / (1 + Math.pow(10, (elo2 - elo1) / 400));
                const prob2 = 1 - prob1;
                const pct1 = Math.round(prob1 * 100);
                const pct2 = Math.round(prob2 * 100);
                const favorite = pct1 >= pct2 ? team1Obj.name : team2Obj.name;
                const favPct = Math.max(pct1, pct2);
                const predictedScore = getPredictedScore(elo1, elo2);

                return `
                    <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-6 shadow-lg space-y-4">
                        <div class="flex flex-wrap justify-between items-center gap-2">
                            <span class="text-xs font-semibold uppercase tracking-wider px-2.5 py-1 bg-amber-500/10 text-amber-400 rounded-full">Pronostic Match Bo5</span>
                            <span class="text-sm text-gray-400">📅 ${match.date} à ${match.time}</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4 py-2">
                            <div class="text-center md:text-right">
                                <h3 class="text-xl font-bold text-white">${team1Obj.name}</h3>
                                <p class="text-xs text-gray-400">${team1Obj.region} (Elo: ${elo1})</p>
                                <span class="text-2xl font-black text-amber-400 mt-1 inline-block">${pct1}%</span>
                            </div>

                            <div class="text-center flex flex-col items-center justify-center">
                                <span class="px-3 py-1 bg-gray-900 border border-gray-700 rounded-full text-xs font-bold text-gray-300">VS</span>
                                <div class="mt-3 px-3 py-1.5 bg-amber-500/10 border border-amber-500/30 rounded-lg">
                                    <span class="text-xs text-gray-400 block uppercase font-bold tracking-wide">Score Prévu (Bo5)</span>
                                    <span class="text-lg font-black text-amber-400">${predictedScore}</span>
                                </div>
                                <p class="text-xs text-emerald-400 font-semibold mt-2">Favori : ${favorite} (${favPct}%)</p>
                            </div>

                            <div class="text-center md:text-left">
                                <h3 class="text-xl font-bold text-white">${team2Obj.name}</h3>
                                <p class="text-xs text-gray-400">${team2Obj.region} (Elo: ${elo2})</p>
                                <span class="text-2xl font-black text-purple-400 mt-1 inline-block">${pct2}%</span>
                            </div>
                        </div>

                        <div class="w-full bg-gray-900 rounded-full h-3 overflow-hidden flex border border-gray-700">
                            <div class="bg-amber-500 h-full transition-all duration-500" style="width: ${pct1}%"></div>
                            <div class="bg-purple-600 h-full transition-all duration-500" style="width: ${pct2}%"></div>
                        </div>

                        <div class="text-xs text-gray-400 bg-gray-900/50 p-3 rounded-lg border border-gray-800">
                            <strong>Analyse de forme :</strong> Basé sur l'écart d'Elo (${Math.abs(elo1 - elo2)} pts) et les dynamiques de victoires/défaites des derniers splits.
                        </div>
                    </div>
                `;
            }).join('');

            mainContent.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">🔮 Pronostiques & Probabilités de Victoire</h2>
                    <p class="text-sm text-gray-400">Analyses prédictives en temps réel basées sur la puissance Elo, les scores Bo5 attendus et les performances récentes des équipes.</p>
                </div>
                <div class="space-y-6">${predictionsHTML}</div>
            `;
        }

        function renderStagesView() {
            const mainContent = document.getElementById('main-content');
            const stagesHTML = tournamentStages.map((stage, idx) => `
                <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-6 shadow-lg">
                    <div class="flex items-center space-x-4 mb-4">
                        <div class="w-10 h-10 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center text-lg border border-amber-500/30">
                            0${idx + 1}
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-white">${stage.name}</h3>
                            <p class="text-xs text-amber-400 font-semibold">${stage.dates}</p>
                        </div>
                    </div>
                    <p class="text-gray-300 text-sm leading-relaxed">${stage.description}</p>
                </div>
            `).join('');

            mainContent.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">Format du Tournoi Worlds 2026</h2>
                    <p class="text-sm text-gray-400">Le championnat du monde se compose de trois phases intenses.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${stagesHTML}</div>
            `;
        }
    </script>
</body>
</html>
