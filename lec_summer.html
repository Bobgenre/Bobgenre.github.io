        body {

        .animate-fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 15, 25, 0.95);

            z-index: 9999; flex-direction: column;
            transition: opacity 0.3s;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #f59e0b;
            animation: spin 1s ease infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .worlds-gradient {
            background: linear-gradient(to right, #f59e0b, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tab-btn.active {
            background-color: #d97706;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(217, 119, 6, 0.3);

                else if (t.region === 'LCP') base = 1500;
                else if (t.region === 'CBLOL') base = 1450;
                
                if (t.seed.includes('Champion')) base += 50;
                if (t.id === 'GEN') base = 1820;
                if (t.id === 'HLE') base = 1800;
                if (t.id === 'T1') base = 1760;
                if (t.id === 'BLG') base = 1750;
                if (t.id === 'AL') base = 1740;
                if (t.id === 'G2') base = 1710;
                if (t.id === 'DK') base = 1700;

                eloMap[t.id] = {
                    team: t,
                    elo: base,
                    winsCount: t.recentWins.length,
                    lossesCount: t.recentLosses.length
                };
            });

            teamsData.forEach(t => {
                t.recentWins.forEach(winStr => {
                    const opp = teamsData.find(x => winStr.toLowerCase().includes(x.id.toLowerCase()) || winStr.toLowerCase().includes(x.name.toLowerCase()));
                    if (opp && eloMap[opp.id]) {
                        eloMap[t.id].elo += Math.round((eloMap[opp.id].elo - eloMap[t.id].elo) * 0.15 + 15);
                    }
                });
                t.recentLosses.forEach(lossStr => {
                    const opp = teamsData.find(x => lossStr.toLowerCase().includes(x.id.toLowerCase()) || lossStr.toLowerCase().includes(x.name.toLowerCase()));
                    if (opp && eloMap[opp.id]) {
                        eloMap[t.id].elo -= Math.round((eloMap[t.id].elo - eloMap[opp.id].elo) * 0.15 + 10);
                    }
                });
            });

            return Object.values(eloMap).sort((a, b) => b.elo - a.elo);
        }

        function computeAdvancedMatchPrediction(team1, team2, rankedTeams) {
            const r1 = rankedTeams.find(r => r.team.id === team1.id);
            const r2 = rankedTeams.find(r => r.team.id === team2.id);
            const elo1 = r1 ? r1.elo : 1500;
            const elo2 = r2 ? r2.elo : 1500;

            // 1. Probabilité Elo de base (Poids: 50%)
            const probElo1 = 1 / (1 + Math.pow(10, (elo2 - elo1) / 400));

            // 2. Comparaison des Joueurs Rôle par Rôle pondérée par la région (Poids: 25%)
            const reg1 = regionCoefficients[team1.region] || 1.0;
            const reg2 = regionCoefficients[team2.region] || 1.0;

            const avgRoster1 = (team1.roster.reduce((sum, p) => sum + p.score, 0) / 5) * reg1;
            const avgRoster2 = (team2.roster.reduce((sum, p) => sum + p.score, 0) / 5) * reg2;
            const probRoster1 = 1 / (1 + Math.pow(10, (avgRoster2 - avgRoster1) / 18));

            // 3. Statistiques Macro Early/Late du Split précédent pondérées par la région (Poids: 25%)
            const m1 = team1.macroStats;
            const m2 = team2.macroStats;
            const macroIndex1 = ((m1.gd15 / 25) + m1.ftPct * 0.8 + m1.objControl * 0.9 + m1.lateGame * 0.8) * reg1;
            const macroIndex2 = ((m2.gd15 / 25) + m2.ftPct * 0.8 + m2.objControl * 0.9 + m2.lateGame * 0.8) * reg2;
            const probMacro1 = 1 / (1 + Math.pow(10, (macroIndex2 - macroIndex1) / 45));

            // Probabilité combinée par manche (Game Win Probability p)
            const gameWinProb1 = Math.min(0.92, Math.max(0.08, (probElo1 * 0.50) + (probRoster1 * 0.25) + (probMacro1 * 0.25)));
            const p = gameWinProb1;
            const q = 1 - p;

            // Distribution binomiale exacte pour un Bo5 (sans aucun hasard)
            const p3_0 = Math.pow(p, 3);
            const p3_1 = 3 * Math.pow(p, 3) * q;
            const p3_2 = 6 * Math.pow(p, 3) * Math.pow(q, 2);
            const p2_3 = 6 * Math.pow(q, 3) * Math.pow(p, 2);
            const p1_3 = 3 * Math.pow(q, 3) * p;
            const p0_3 = Math.pow(q, 3);

            const seriesWinProb1 = p3_0 + p3_1 + p3_2;
            const seriesWinProb2 = p2_3 + p1_3 + p0_3;

            const scoreOutcomes = [
                { score: '3 - 0', prob: p3_0, winner: 1 },
                { score: '3 - 1', prob: p3_1, winner: 1 },
                { score: '3 - 2', prob: p3_2, winner: 1 },
                { score: '2 - 3', prob: p2_3, winner: 2 },
                { score: '1 - 3', prob: p1_3, winner: 2 },
                { score: '0 - 3', prob: p0_3, winner: 2 }
            ];

            // Détermination du score exact le plus probable selon l'écart de puissance
            const bestOutcome = [...scoreOutcomes].sort((a, b) => b.prob - a.prob)[0];

            // Comparaison ligne par ligne
            const laneMatchups = team1.roster.map((p1, idx) => {
                const p2 = team2.roster[idx];
                const eff1 = p1.score * Math.sqrt(reg1);
                const eff2 = p2.score * Math.sqrt(reg2);
                const diff = eff1 - eff2;
                return {
                    role: p1.role,
                    p1Name: p1.name,
                    p1Score: p1.score,
                    p2Name: p2.name,
                    p2Score: p2.score,
                    advantage: Math.abs(diff) < 1.2 ? 'Équilibré' : (diff > 0 ? team1.id : team2.id)
                };
            });

            return {
                elo1,
                elo2,
                seriesPct1: Math.round(seriesWinProb1 * 100),
                seriesPct2: 100 - Math.round(seriesWinProb1 * 100),
                predictedScore: bestOutcome.score,
                scoreOutcomes,
                laneMatchups
            };
        }

                }

                const analysis = computeAdvancedMatchPrediction(team1Obj, team2Obj, rankedTeams);
                const favorite = analysis.seriesPct1 >= analysis.seriesPct2 ? team1Obj.name : team2Obj.name;
                const favPct = Math.max(analysis.seriesPct1, analysis.seriesPct2);

                const lanesHTML = analysis.laneMatchups.map(lane => {
                    const advBadge = lane.advantage === 'Équilibré'
                        ? `<span class="text-xs px-2 py-0.5 rounded bg-gray-700 text-gray-300">Équilibré</span>`
                        : lane.advantage === team1Obj.id
                            ? `<span class="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 font-bold">Avantage ${team1Obj.id}</span>`
                            : `<span class="text-xs px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-bold">Avantage ${team2Obj.id}</span>`;

                    return `
                        <div class="flex items-center justify-between bg-gray-900/60 px-3 py-2 rounded-lg border border-gray-700/40 text-xs sm:text-sm">
                            <div class="w-1/3 font-semibold text-white">${lane.p1Name} <span class="text-gray-400">(${lane.p1Score})</span></div>
                            <div class="w-1/3 text-center flex flex-col items-center">
                                <span class="text-[11px] uppercase tracking-wider text-gray-400 font-bold mb-0.5">${lane.role}</span>
                                ${advBadge}
                            </div>
                            <div class="w-1/3 text-right font-semibold text-white"><span class="text-gray-400">(${lane.p2Score})</span> ${lane.p2Name}</div>
                        </div>
                    `;
                }).join('');

                const scoresBreakdownHTML = analysis.scoreOutcomes.map(item => {
                    const pct = Math.round(item.prob * 100);
                    const isBest = item.score === analysis.predictedScore;
                    return `
                        <div class="p-2 rounded-lg text-center border ${isBest ? 'bg-amber-500/20 border-amber-500 text-amber-300 font-bold' : 'bg-gray-900/50 border-gray-700/50 text-gray-400'}">
                            <span class="block text-sm text-white font-bold">${item.score}</span>
                            <span class="text-xs">${pct}%</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-6 shadow-lg space-y-5">
                        <div class="flex flex-wrap justify-between items-center gap-2">
                            <span class="text-xs font-semibold uppercase tracking-wider px-2.5 py-1 bg-amber-500/10 text-amber-400 rounded-full">Analyse Multi-Facteurs (${match.format})</span>
                            <span class="text-sm text-gray-400">📅 ${match.date} à ${match.time}</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4 py-2">
                            <div class="text-center md:text-right">
                                <h3 class="text-xl font-bold text-white">${team1Obj.name}</h3>
                                <p class="text-xs text-gray-400">${team1Obj.region} (Elo: ${analysis.elo1})</p>
                                <span class="text-3xl font-black text-amber-400 mt-1 inline-block">${analysis.seriesPct1}%</span>
                            </div>

                            <div class="text-center flex flex-col items-center justify-center">
                                <span class="px-3 py-1 bg-gray-900 border border-gray-700 rounded-full text-xs font-bold text-gray-300">VS</span>
                                <div class="mt-3 px-4 py-2 bg-amber-500/10 border border-amber-500/30 rounded-xl">
                                    <span class="text-xs text-gray-400 block uppercase font-bold tracking-wide">Score Prévu (${match.format})</span>
                                    <span class="text-2xl font-black text-amber-400">${analysis.predictedScore}</span>
                                </div>
                                <p class="text-xs text-emerald-400 font-semibold mt-2">Favori : ${favorite} (${favPct}%)</p>
                            </div>

                            <div class="text-center md:text-left">
                                <h3 class="text-xl font-bold text-white">${team2Obj.name}</h3>
                                <p class="text-xs text-gray-400">${team2Obj.region} (Elo: ${analysis.elo2})</p>
                                <span class="text-3xl font-black text-purple-400 mt-1 inline-block">${analysis.seriesPct2}%</span>
                            </div>
                        </div>

                        <div class="w-full bg-gray-900 rounded-full h-3 overflow-hidden flex border border-gray-700">
                            <div class="bg-amber-500 h-full transition-all duration-500" style="width: ${analysis.seriesPct1}%"></div>
                            <div class="bg-purple-600 h-full transition-all duration-500" style="width: ${analysis.seriesPct2}%"></div>
                        </div>

                        <!-- Détails statistiques Early/Late & Matchups par rôle -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 pt-4 border-t border-gray-700/50">
                            <div>
                                <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">⚔️ Confrontations Rôle par Rôle (Stats 2026)</h4>
                                <div class="space-y-2">${lanesHTML}</div>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">📊 Comparatif Early & Macro (Splits 2026)</h4>
                                    <div class="bg-gray-900/60 rounded-lg p-3 border border-gray-700/40 space-y-2 text-xs sm:text-sm">
                                        <div class="flex justify-between">
                                            <span class="font-bold text-amber-400">+${team1Obj.macroStats.gd15}g</span>
                                            <span class="text-gray-400">Gold Diff @ 15 min</span>
                                            <span class="font-bold text-purple-400">+${team2Obj.macroStats.gd15}g</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="font-bold text-amber-400">${team1Obj.macroStats.ftPct}%</span>
                                            <span class="text-gray-400">Première Tour (First Tower)</span>
                                            <span class="font-bold text-purple-400">${team2Obj.macroStats.ftPct}%</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="font-bold text-amber-400">${team1Obj.macroStats.objControl}%</span>
                                            <span class="text-gray-400">Contrôle Objectifs Neutres</span>
                                            <span class="font-bold text-purple-400">${team2Obj.macroStats.objControl}%</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="font-bold text-amber-400">${team1Obj.macroStats.lateGame}/100</span>
                                            <span class="text-gray-400">Indice Teamfight Late Game</span>
                                            <span class="font-bold text-purple-400">${team2Obj.macroStats.lateGame}/100</span>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🎯 Probabilités des Scores Exacts (Bo5)</h4>
                                    <div class="grid grid-cols-6 gap-2">${scoresBreakdownHTML}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            mainContent.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">🔮 Pronostiques & Analyse Multi-Facteurs</h2>
                    <p class="text-sm text-gray-400">Calcul déterministe combinant le score Elo (50%), les matchups individuels par ligne (25%) et les statistiques Early/Late du dernier split pondérées par région (25%).</p>
                </div>
                <div class="space-y-6">${predictionsHTML}</div>
            `;
        }

        function renderStagesView() {
            const mainContent = document.getElementById('main-content');
            const stagesHTML = tournamentStages.map((stage, idx) => `
                <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-6 shadow-lg">
                    <div class="flex items-center space-x-4 mb-4">
                        <div class="w-10 h-10 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center text-lg border border-amber-500/30">
                            0${idx + 1}
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-white">${stage.name}</h3>
                            <p class="text-xs text-amber-400 font-semibold">${stage.dates}</p>
                        </div>
                    </div>
                    <p class="text-gray-300 text-sm leading-relaxed">${stage.description}</p>
                </div>
            `).join('');

            mainContent.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">Format du Tournoi Worlds 2026</h2>
                    <p class="text-sm text-gray-400">Le championnat du monde se compose de trois phases intenses.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${stagesHTML}</div>
            `;
        }
    </script>
</body>
</html>
